    tests: Segment reporting + operating KPIs
    financial_year: Apr-Mar
    basis: consolidated

  - id: ASIANPAINT
    name: Asian Paints Ltd
    nse: ASIANPAINT
    bse: "500820"
    sector: Consumer / manufacturing
    tests: Segment + operational metrics
    financial_year: Apr-Mar
    basis: consolidated

  - id: MM
    name: Mahindra & Mahindra Ltd   # replaces Tata Motors (2025 demerger -> restated comparatives)
    nse: M&M
    bse: "500520"
